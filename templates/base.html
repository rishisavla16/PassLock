<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secure PM{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="page-wrapper">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-inner">
        <div class="nav-brand"><a href="/" style="color: inherit; text-decoration: none;">PassLock</a></div>
        <div class="nav-links">
          <button id="themeToggleBtn" class="theme-toggle-btn">☀</button>
          {% block header_user_info %}{% endblock %}
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="app-shell" style="flex: 1; width: min(1000px, 92vw); margin: 3rem auto;">
       {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-links">
          <a href="/faq">FAQ</a>
          <a href="/privacy">Privacy Policy</a>
          <a href="/terms">Terms of Use</a>
        </div>
        <p class="footer-credits">
          <strong>PassLock</strong> &nbsp;&bull;&nbsp; Developed by <strong>Rishi Savla</strong>
        </p>
      </div>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
